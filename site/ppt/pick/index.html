<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GarmanPPT 组合挑选 · 配色 × 风格</title>
<meta name="description" content="GarmanPPT 组合挑选：13 套矿物配色 × 16 种设计风格，共 208 种组合，可看 6 页真实预览图、直接下载 pptx 模板，复制口令交给智能体即可生成 PPT。">
<meta property="og:type" content="website">
<meta property="og:title" content="GarmanPPT 组合挑选 · 配色 × 风格">
<meta property="og:description" content="13 套矿物配色 × 16 种设计风格，选好搭配复制口令，交给智能体生成 PPT；也可直接下载模板。">
<meta property="og:url" content="https://www.zhaodun.work/ppt/pick/">
<meta property="og:image" content="https://www.zhaodun.work/ppt/media/palettes-13.webp">
<link rel="stylesheet" href="pick.css?v=0.6.1">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="util"><a href="../../">← 返回首页</a><button type="button" data-share>分享</button><span class="share-status" aria-live="polite"></span></div>
    <a class="brand" href="../">GarmanPPT</a>
    <h1>选一套配色 × 风格</h1>
    <p class="lead">选好后复制口令，和技能包、你的文档一起交给智能体；也可以直接下载模板自己填。</p>
    <div class="dialbox">
      <div class="dial" role="radiogroup" aria-label="挑选方式转盘" tabindex="0">
        <span class="mark" aria-hidden="true"></span>
        <div class="disk" id="disk">
          <button role="radio" data-mode="p" aria-checked="true" aria-label="P 程序自动">P</button>
          <button role="radio" data-mode="s" aria-checked="false" aria-label="S 风格优先">S</button>
          <button role="radio" data-mode="c" aria-checked="false" aria-label="C 色彩优先">C</button>
          <button role="radio" data-mode="m" aria-checked="false" aria-label="M 手动">M</button>
        </div>
      </div>
      <div class="dialinfo">
        <p class="modename" id="modeName"></p>
        <p class="muted small" id="modeDesc"></p>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="controls">
    <label id="docWrap">文档类型
      <select id="doc"><option value="">不指定</option></select>
    </label>
    <fieldset class="fx">
      <legend>效果</legend>
      <label><input type="radio" name="fx" value="plain" checked> 普通</label>
      <label><input type="radio" name="fx" value="glass"> 毛玻璃</label>
    </fieldset>
  </section>

  <div class="grid">
    <section class="col">
      <h2 id="headA">1 · 风格</h2>
      <ul id="listA" class="list"></ul>
    </section>
    <section class="col">
      <h2 id="headB">2 · 配色</h2>
      <p id="hintB" class="muted"></p>
      <ul id="listB" class="list"></ul>
    </section>
    <section class="col result">
      <h2>3 · 结果</h2>
      <div id="preview" class="preview" aria-label="示意样张"></div>
      <p id="note" class="note" hidden></p>
      <div id="out" hidden>
        <p class="combo" id="combo"></p>
        <div class="btns">
          <a id="dlTpl" class="btn" download>下载模板</a>
          <button id="aiBtn" class="btn primary" aria-expanded="false">用 AI 生成成品</button>
        </div>
        <ol id="ai" class="ai" hidden>
          <li>下载技能包：<a id="skillLink" target="_blank" rel="noopener">GitHub Release</a></li>
          <li>复制口令：
            <code id="cmd"></code>
            <button id="copy" class="btn small">复制</button>
          </li>
          <li>把技能包、口令和你的文档一起发给智能体。</li>
        </ol>
        <p class="muted small"><a id="detail" target="_blank" rel="noopener">看这种风格的详细说明</a></p>
      </div>
      <p id="opening" class="opening" hidden></p>
    </section>
  </div>
</main>

<footer class="wrap foot muted small">
  16 种风格 × 13 套配色共 208 个组合，每个都有 6 页预览和可下载的模板。数据版本 <span id="ver"></span> · <a href="../">GarmanPPT 说明页</a> · <a href="../../">返回首页</a>
</footer>
<script src="pick.js?v=0.6.1"></script>
<script>
(function(){
  function setStatus(m){document.querySelectorAll(".share-status").forEach(function(el){el.textContent=m;});setTimeout(function(){document.querySelectorAll(".share-status").forEach(function(el){el.textContent="";});},2200);}
  async function sharePage(){
    var data={title:document.title,text:"GarmanPPT 组合挑选：配色 × 风格",url:location.href.split("#")[0]};
    try{
      if(navigator.share){await navigator.share(data);return;}
      await navigator.clipboard.writeText(data.url);setStatus("链接已复制");
    }catch(err){
      if(err&&err.name==="AbortError")return;
      try{var ta=document.createElement("textarea");ta.value=data.url;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();setStatus("链接已复制");}
      catch(_){setStatus("请复制浏览器地址栏链接");}
    }
  }
  document.querySelectorAll("[data-share]").forEach(function(b){b.addEventListener("click",sharePage);});
})();
</script>
</body>
</html>
